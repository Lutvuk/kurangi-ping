name: CI Baseline

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  db_migration_verify:
    name: DB Migration Verify (migrate/seed)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Verify DB migrations and seed idempotency
        shell: pwsh
        run: ./scripts/ci-verify-db.ps1

      - name: Upload DB verification log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: db-verification-log
          path: scripts/logs/ci-db-verify.log
          if-no-files-found: error

  desktop_ts:
    name: Desktop TS (type/test/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Build desktop app
        run: pnpm build

  rust_client_engine:
    name: Rust Client Engine (check/test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust format check
        run: cargo fmt --check --manifest-path crates/client-engine/Cargo.toml

      - name: Rust lint
        run: cargo clippy --manifest-path crates/client-engine/Cargo.toml -- -D warnings

      - name: Rust tests
        run: cargo test --manifest-path crates/client-engine/Cargo.toml

      - name: Rust build
        run: cargo build --manifest-path crates/client-engine/Cargo.toml

  go_relay_controller:
    name: Go Relay Controller (vet/test/build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/relay-controller
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: apps/relay-controller/go.mod
          cache-dependency-path: apps/relay-controller/go.mod

      - name: Go test
        run: go test ./...

      - name: Go vet
        run: go vet ./...

      - name: Go build
        run: go build ./...

  release_trust_gate_placeholder:
    name: Release Trust Gate Placeholder
    runs-on: ubuntu-latest
    needs:
      - db_migration_verify
      - desktop_ts
      - rust_client_engine
      - go_relay_controller
    if: ${{ github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/') }}
    steps:
      - name: Signing gate placeholder
        run: |
          echo "Placeholder: enforce signed binaries before public release (KP-105)."
          echo "CI should fail release if signing verification is missing or invalid."

      - name: Updater artifact placeholder
        run: |
          echo "Placeholder: publish updater artifacts and trust metadata for desktop channels."
          echo "Future stage should gate rollout by channel (beta/stable)."
