[package]
name = "client-engine"
version = "0.1.0"
edition = "2021"
description = "Kurangi Ping client network engine scaffold"
license = "UNLICENSED"
publish = false

[lib]
name = "client_engine"
path = "src/lib.rs"

[dependencies]
rusqlite = { version = "0.32.1", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59.0", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
] }

[dev-dependencies]
serde_json = "1.0.145"
